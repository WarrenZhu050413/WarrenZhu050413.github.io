<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smoky blue → silver-grey</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;font-family:'Source Serif 4',Georgia,serif;background:#141412;color:#deded5}*{box-sizing:border-box}body{margin:0}main{min-height:100svh;display:grid;place-items:center;isolation:isolate;--a:83,111,128;--b:113,138,135}.glass{position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(118deg,rgba(var(--a),.13),transparent 65%),linear-gradient(300deg,rgba(var(--b),.09),transparent 70%)}.poem{text-align:center;margin:-40px 28px 120px;font-size:clamp(27px,3.2vw,49px);line-height:1.65;font-weight:400;letter-spacing:-.015em}.poem p{margin:0}.colour{color:#b9ccd0;background:linear-gradient(105deg,#cbd2d0 3%,#d1d3cc 38%,#d3cdcd 70%,#d1d0cb 100%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}.controls{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);width:min(680px,calc(100vw - 56px));font-size:14px;color:#abb5b0}.stops{display:flex;justify-content:space-between;gap:18px}.stop{padding:10px 0;background:none;border:0;color:#a5aca6;font:inherit;cursor:pointer;text-align:left;opacity:.6;transition:opacity .4s}.stop:hover,.stop:focus-visible,.stop[aria-pressed=true]{opacity:1}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:var(--swatch);box-shadow:0 0 12px color-mix(in srgb,var(--swatch) 14%,transparent)}input{width:100%;height:24px;margin:15px 0 10px;accent-color:#abbcb5;cursor:ew-resize;appearance:none;background:transparent}input::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#536f80,#647c76,#987d88,#8a8e8d)}input::-webkit-slider-thumb{appearance:none;margin-top:-5px;width:12px;height:12px;border:1px solid #c2cec9;border-radius:50%;background:#303b36}input::-moz-range-track{height:2px;background:linear-gradient(90deg,#536f80,#647c76,#987d88,#8a8e8d)}input::-moz-range-thumb{width:10px;height:10px;border:1px solid #c2cec9;border-radius:50%;background:#303b36}.meta{display:flex;justify-content:space-between;align-items:center;gap:18px;color:#828d85;font-size:12px}.play{font:inherit;color:#bac5bd;background:none;border:0;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#a4b5a544}.play:hover{color:#e1e5db}:focus-visible{outline:1px solid #9dafa5;outline-offset:5px}a{color:inherit;text-underline-offset:4px}header{position:absolute;top:30px;left:36px;right:36px;display:flex;justify-content:space-between;gap:20px;font-size:13px;color:#89958d}header a{text-decoration:none}@media(prefers-reduced-motion:reduce){.stop{transition:none}}@media(max-width:600px){.stops{gap:6px}.stop{font-size:12px}.swatch{display:block;margin-bottom:8px}.poem{font-size:27px}}
</style></head><body><main id="preview"><div class="glass"></div><header><span>Colour transition</span><a href="/posts/i-wish-it-were-not-dark/#nabokov">Back to the essay ↗</a></header><div class="poem"><p>The present becoming the past<br><span class="colour">colours</span> my loves and fears.</p></div><div class="controls"><div class="stops">
<button class="stop" data-stop="0" style="--swatch:#536f80" aria-pressed="true"><span class="swatch"></span>Smoky blue</button>
<button class="stop" data-stop="1" style="--swatch:#647c76" aria-pressed="false"><span class="swatch"></span>Muted sage</button>
<button class="stop" data-stop="2" style="--swatch:#987d88" aria-pressed="false"><span class="swatch"></span>Dusty rose</button>
<button class="stop" data-stop="3" style="--swatch:#8a8e8d" aria-pressed="false"><span class="swatch"></span>Silver-grey</button>
</div><input type="range" min="0" max="300" step="0.1" value="0" aria-label="Colour transition"><div class="meta"><button class="play" aria-pressed="false">Play slowly</button><span>18 seconds between colours · same subtle intensity as the essay</span></div></div></main>
<script>
const main=document.querySelector('main'),slider=document.querySelector('input'),play=document.querySelector('.play'),stops=[...document.querySelectorAll('.stop')];
const colours=[[[83,111,128],[113,138,135]],[[100,124,118],[134,139,112]],[[152,125,136],[173,146,148]],[[138,142,141],[161,157,147]]];
let frame=null,last=0;
function draw(){const value=Number(slider.value)/100,i=Math.min(2,Math.floor(value)),t=value-i;for(let c=0;c<2;c++){const rgb=colours[i][c].map((v,k)=>Math.round(v+(colours[i+1][c][k]-v)*t));main.style.setProperty(c?'--b':'--a',rgb.join(','))}stops.forEach((s,k)=>s.setAttribute('aria-pressed',String(Math.abs(value-k)<.08)))}
function pause(){if(frame!==null)cancelAnimationFrame(frame);frame=null;last=0;play.textContent='Play slowly';play.setAttribute('aria-pressed','false')}
function tick(now){if(last)slider.value=Math.min(300,Number(slider.value)+(now-last)*100/18000);last=now;draw();if(Number(slider.value)>=300){pause();return}frame=requestAnimationFrame(tick)}
play.addEventListener('click',()=>{if(frame!==null){pause();return}if(Number(slider.value)>=300)slider.value=0;play.textContent='Pause';play.setAttribute('aria-pressed','true');frame=requestAnimationFrame(tick)});
slider.addEventListener('input',()=>{pause();draw()});stops.forEach(s=>s.addEventListener('click',()=>{pause();slider.value=Number(s.dataset.stop)*100;draw()}));document.addEventListener('visibilitychange',()=>{last=0});addEventListener('pagehide',pause);draw();
</script></body></html>
